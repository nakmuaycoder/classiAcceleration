defaults:
  - model: standard
  - training: default
  - data: dataset
  - override hydra/sweeper: optuna
  - _self_

experiment_name: default
output_dir: ${hydra:runtime.cwd}/output/${experiment_name}

# 🧪 OPTUNA HYPERPARAMETER SEARCH CONFIGURATION (NAS)
hydra:
  job:
    chdir: true
  run:
    dir: output/${experiment_name}/run_${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: output/${experiment_name}/multirun_${now:%Y-%m-%d_%H-%M-%S}
    subdir: run_trial_${hydra.job.num}
  sweeper:
    direction: maximize
    storage: null
    study_name: tinyml_architecture_search
    n_trials: 50
    n_jobs: 1

    # 🎯 SEARCH SPACE
    params:
      training.lr: interval(0.001, 0.1)
      data.seq_len: choice(15, 20, 30, 40)
      model.filters: choice([2, 4], [4, 8], [8, 16], [16, 32])
      model.hidden_dim: choice(8, 16, 32)
      data.augment: choice(true, false)
      data.use_norm: choice(true, false)
      data.use_pca: choice(true, false)
      data.augmentations.rotation: choice(true, false)
      data.augmentations.noise: choice(true, false)
      data.augmentations.scaling: choice(true, false)
      data.augmentations.bias: choice(true, false)
